[package]
name = "mullion-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mullion-proto = { workspace = true }
dioxus = { version = "0.7.10", features = [] }
serde_json = { workspace = true }
serde = { workspace = true }
# The Nearby sweep's answer comes back from a thread (main.rs).
futures-channel = "0.3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# Windows: the Mullion icon and file description in the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
