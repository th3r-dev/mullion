<div class="stage" id="stage">
  <video id="v" muted autoplay playsinline></video>
</div>

<div class="setup" id="setup">
  <div class="card" id="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="13" width="26" height="38" rx="5" fill="var(--ink)"/>
        <rect x="34" y="13" width="26" height="38" rx="5" fill="var(--accent)"/>
        <path d="M30 23 V45 L35.2 40.2 L38.8 48.4 L42.4 46.8 L38.8 38.8 L45.6 38.8 Z" fill="#fff" stroke="#111418" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <div><h1>Mullion</h1><p>One desk, every screen.</p></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="name">This device</label>
        <input id="name" autocomplete="off" maxlength="32" placeholder="Name">
      </div>
      <div class="field">
        <label>Show</label>
        <div class="seg" role="radiogroup" aria-label="Mode">
          <div class="thumb" id="thumb"></div>
          <button id="segMirror" type="button" aria-pressed="true" title="Show the same picture as the Mac"><svg class="i" aria-hidden="true"><use href="#i-mirror"/></svg><span>Mirror</span></button>
          <button id="segExtend" type="button" aria-pressed="false" title="Use this device as an extra screen"><svg class="i" aria-hidden="true"><use href="#i-extend"/></svg><span>Extend</span></button>
        </div>
      </div>
    </div>
    <section class="nearby" aria-labelledby="nearbyTitle">
      <div class="nearby-head">
        <span class="label" id="nearbyTitle">Nearby</span>
        <span class="nearby-status" id="nearbyStatus" aria-live="polite"></span>
        <button class="icon-btn" id="scanBtn" type="button" title="Look again" aria-label="Look again"><svg class="i" aria-hidden="true"><use href="#i-scan"/></svg></button>
      </div>
      <div class="scanbar" id="scanBar" aria-hidden="true"><span id="scanFill"></span></div>
      <ul class="hosts" id="hosts" aria-label="Hosts on this network"></ul>
      <p class="nearby-empty" id="nearbyEmpty"></p>
    </section>
    <div class="field">
      <label for="ip">Or enter the address</label>
      <input id="ip" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Address shown by Mullion, e.g. 10.43.77.126">
    </div>
    <button class="primary" id="go" type="button"><svg class="i" aria-hidden="true"><use href="#i-connect"/></svg><span>Connect</span></button>
    <button class="ghost" id="screensSetupBtn" type="button" title="See every screen of the Mac and move them"><svg class="i" aria-hidden="true"><use href="#i-screens"/></svg><span>Arrange screens</span></button>
    <div class="hint" id="hint"></div>
  </div>
  <p class="version" id="version"></p>
  <nav class="links" aria-label="Project">
    <a href="https://github.com/th3r-dev/mullion" target="_blank" rel="noopener noreferrer"><svg class="i" aria-hidden="true"><use href="#i-github"/></svg><span>GitHub</span></a>
    <a href="https://github.com/sponsors/th3r-dev" target="_blank" rel="noopener noreferrer"><svg class="i heart" aria-hidden="true"><use href="#i-heart"/></svg><span>Sponsor</span></a>
  </nav>
</div>

<div class="toolbar" id="toolbar" role="toolbar">
  <span class="dot" aria-hidden="true"></span>
  <span class="name" id="nameOut">Tablet</span>
  <span class="sep"></span>
  <button id="modeBtn" type="button" title="Switch between Mirror and Extend"><svg class="i" aria-hidden="true"><use id="modeIcon" href="#i-mirror"/></svg><span id="modeLabel">Mirror</span></button>
  <button id="screensBtn" type="button" title="See every screen and move them"><svg class="i" aria-hidden="true"><use href="#i-screens"/></svg><span>Screens</span></button>
  <button id="fsBtn" type="button" title="Full screen"><svg class="i" aria-hidden="true"><use id="fsIcon" href="#i-fullscreen"/></svg><span id="fsLabel">Full screen</span></button>
  <button id="dcBtn" type="button" title="Stop showing the Mac"><svg class="i" aria-hidden="true"><use href="#i-disconnect"/></svg><span>Disconnect</span></button>
</div>

<div class="status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="text"></span></div>
<div class="hud" id="hud" aria-hidden="true"></div>

<!-- Layout map (layout.js): every screen of the host, host in the middle. -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel" tabindex="-1">
    <header>
      <div>
        <h2 id="sheetTitle"><svg class="i" aria-hidden="true"><use href="#i-screens"/></svg>Screens</h2>
        <p id="sheetSub"></p>
      </div>
      <button class="pill" id="sheetDone" type="button">Done</button>
    </header>
    <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
    <div class="sheet-hint" id="sheetHint" role="status" aria-live="polite"></div>
  </div>
</div>
