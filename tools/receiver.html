<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Mullion receiver (browser smoke test)</title>
<link rel="icon" href="../crates/app/assets/icons/favicon.ico">
<link rel="stylesheet" href="../crates/app/assets/ui.css">
<body></body>
<script>
  fetch('../crates/app/assets/ui.html').then(r => r.text()).then(html => {
    document.body.innerHTML = html;
    const s1 = document.createElement('script'); s1.src = '../crates/app/assets/receiver.js';
    s1.onload = () => { const s2 = document.createElement('script'); s2.src = '../crates/app/assets/ui.js'; document.body.appendChild(s2); };
    document.body.appendChild(s1);
  });
</script>
