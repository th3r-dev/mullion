# Beta release: build every package, publish them as one GitHub pre-release.
#
#   Mullion-<v>.pkg                    Mac host (Apple silicon, macOS 14+)
#   Mullion-<v>-windows-x64.exe        Windows viewer: the receiver app, watches a host
#   Mullion-<v>-android-arm64.apk      Tablet app (debug-signed: uninstall the old
#                                      beta before installing a new one)
#
# How it runs:
#   - A pull request into dev: tests and builds every package, publishes
#     nothing (packages are on the run's page). A newer push to the PR cancels
#     the older run.
#   - Merging it (any push to dev): builds and publishes the next beta,
#     <Cargo.toml version>-beta.<run number>, e.g. 0.1.0-beta.12, and tags it.
#     Run numbers count PR runs too, so betas are not consecutive.
#   - By hand: Actions > Beta release > Run workflow. Untick "publish" for a
#     dry run.
#   - Push a tag: git tag v0.1.0-beta.3 && git push origin v0.1.0-beta.3
# Changes to Markdown alone do not run it.
#
# Mullion.app checks these releases for updates (crates/host/src/update.rs);
# it installs the .pkg asset.
name: Beta release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the pre-release (untick for a build-only dry run)
        type: boolean
        default: true
  pull_request:
    branches: [dev]
    paths-ignore: ["**.md"]
  push:
    branches: [dev]
    tags: ["v*-beta.*"]
    paths-ignore: ["**.md"]

permissions:
  contents: write

# Releases one at a time, in order; a PR's runs replace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('beta-pr-{0}', github.ref) || 'release-beta' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            v="$base-beta.$GITHUB_RUN_NUMBER"
          fi
          case "$v" in *-beta.*) ;; *) echo "::error::$v is not a beta version"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  macos:
    needs: version
    # Apple silicon, like the package (hostArchitectures="arm64").
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MULLION_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the app's build number is the commit count
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p mullion-proto -p mullion-host
      # The signing certificate: the same one every release, so macOS keeps
      # Mullion's Screen Recording permission across updates. Self-signed is
      # enough for that (tools/package-macos.sh). Without the secret the app
      # is ad-hoc signed and every update asks for the permission again.
      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::No MACOS_SIGN_P12 secret: ad-hoc signing"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kp=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          echo "MULLION_SIGN_ID=Mullion Code Signing" >> "$GITHUB_ENV"
      - name: Package
        run: tools/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Mullion-${{ env.MULLION_VERSION }}.pkg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MULLION_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the viewer
        run: cargo build -p mullion-app --release
      - name: Name it
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mullion-app.exe "dist/Mullion-$MULLION_VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Mullion-${{ env.MULLION_VERSION }}-windows-x64.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MULLION_VERSION: ${{ needs.version.outputs.version }}
      DX_VERSION: 0.7.10 # tools/build-android.sh relies on this dx's Gradle layout
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dx
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION"
          curl -fsSLO "$base/dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "$base/dx-x86_64-unknown-linux-gnu.sha256"
          # The .sha256 file lists the .tar.gz and the .zip; check the one we use.
          grep ' dx-x86_64-unknown-linux-gnu.tar.gz$' dx-x86_64-unknown-linux-gnu.sha256 | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          dx --version
          tools/build-android.sh
          cp dist/mullion-tablet-debug.apk "dist/Mullion-$MULLION_VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/Mullion-${{ env.MULLION_VERSION }}-android-arm64.apk
          if-no-files-found: error

  release:
    needs: [version, macos, windows, android]
    # Pull requests build only.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    env:
      MULLION_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "v$MULLION_VERSION" dist/* \
            -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Mullion $MULLION_VERSION (beta)" \
            --generate-notes \
            --notes "Beta build. Pick the file for your device:

          - **Mac (host)**: \`Mullion-$MULLION_VERSION.pkg\`, Apple silicon, macOS 14 or later. Open it to install; Mullion.app finds later betas itself (menu bar > Check for Updates…).
          - **Windows (viewer)**: \`Mullion-$MULLION_VERSION-windows-x64.exe\`, Windows 10 or 11. Watches a Mac running Mullion, or uses this PC as its extra screen. Sharing a Windows PC's own screen is not built yet.
          - **Android tablet**: \`Mullion-$MULLION_VERSION-android-arm64.apk\`. Debug-signed: uninstall the previous beta before installing this one.

          None of these are signed by a store or notarized: macOS may need Control-click > Open on a downloaded .pkg, Windows SmartScreen may need More info > Run anyway, and Android needs installs from unknown sources allowed."
